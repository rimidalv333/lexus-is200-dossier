<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" viewBox="-16.0 -16.0 932.0 432.0" width="932" height="432" role="img" aria-label="End-to-end flow from accelerator pedal to throttle plate">
<style>
svg { --paper:#f3ecde; --paper-raised:#faf4e5; --paper-sunken:#ead9bd; --ink:#1b1611; --ink-mid:#4a3e30; --ink-soft:#7a6b55; --rule:#b4a284; --rule-faint:#d7c7a7; --signal:#b43a1e; --signal-soft:#e9b7a8; --measure:#2b4867; --measure-soft:#a7bbd2; --mech:#c3a97d; --mech-dark:#6d5c48; --mech-fill:#d9c197; --green:#4a7a3a; color: var(--ink);
  --font-display: 'Fraunces','Iowan Old Style',Palatino,Georgia,serif;
  --font-body: 'Source Serif 4','Iowan Old Style',Georgia,serif;
  --font-mono: 'IBM Plex Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { svg { --paper:#16130f; --paper-raised:#1f1a14; --paper-sunken:#0e0c09; --ink:#ece3d1; --ink-mid:#c3b89f; --ink-soft:#9e937d; --rule:#4a3f30; --rule-faint:#2c2519; --signal:#e86a4d; --signal-soft:#4a211a; --measure:#8bb0d4; --measure-soft:#203247; --mech:#a08358; --mech-dark:#d9c197; --mech-fill:#3d3220; --green:#88b876; } }
.bg { fill: var(--paper-raised); stroke: var(--rule-faint); }
.d-svg { font-family: var(--font-mono); }
text { fill: var(--ink); font-size: 11px; font-family: var(--font-mono); }
.lbl-sm { font-size: 9px; }
.lbl-xs { font-size: 8px; fill: var(--ink-soft); }
.ttl { font-family: var(--font-display); font-size: 13px; font-weight: 500; }
.mech-fill { fill: var(--mech-fill); stroke: var(--mech-dark); stroke-width: 1.2; }
.mech-line { stroke: var(--mech-dark); stroke-width: 1.2; fill: none; }
.ink-line { stroke: var(--ink); stroke-width: 1.3; fill: none; }
.ink-thin { stroke: var(--ink-soft); stroke-width: 0.8; fill: none; }
.ink-fill { fill: var(--ink); }
.signal-line { stroke: var(--signal); stroke-width: 1.6; fill: none; }
.signal-fill { fill: var(--signal); }
.measure-line { stroke: var(--measure); stroke-width: 1.6; fill: none; }
.measure-fill { fill: var(--measure); }
.dashed { stroke-dasharray: 4 3; }
.dotted { stroke-dasharray: 1.5 2.5; }
.box { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 1.2; }
.box-signal { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.2; }
.box-measure { fill: var(--measure-soft); stroke: var(--measure); stroke-width: 1.2; }
.wire-red { stroke: var(--signal); stroke-width: 1.4; fill: none; }
.wire-blue { stroke: var(--measure); stroke-width: 1.4; fill: none; }
.wire-ink { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.wire-brown { stroke: var(--mech-dark); stroke-width: 1.4; fill: none; }
.wire-green { stroke: var(--green); stroke-width: 1.4; fill: none; }
.anno { font-size: 10px; fill: var(--ink-mid); font-style: italic; font-family: var(--font-body); }
</style>
<rect class="bg" x="-16.0" y="-16.0" width="932.0" height="432.0" rx="6"/>

      <title id="fig1-t">End-to-end flow from accelerator pedal to throttle plate</title>
      
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
        </marker>
        <marker id="arrow-sig" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" class="signal-fill"/>
        </marker>
        <marker id="arrow-meas" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" class="measure-fill"/>
        </marker>
      </defs>

      
      <text x="80" y="36" class="ttl">Driver</text>
      
      <line x1="70" y1="200" x2="70" y2="300" class="ink-line" stroke-width="2"/>
      <circle cx="70" cy="200" r="4" class="ink-fill"/>
      <path d="M70 300 L130 320 L130 285 L75 268 Z" class="mech-fill"/>
      <text x="60" y="340" class="lbl-sm">Pedal</text>

      
      <path d="M135 290 C 190 285, 230 275, 260 240 S 320 170, 340 170" class="ink-line dashed"/>
      <text x="200" y="220" class="anno">cable</text>

      
      <rect x="340" y="110" width="320" height="200" rx="4" ry="4" class="mech-fill"/>
      <text x="350" y="100" class="ttl">Throttle body</text>

      
      <rect x="340" y="230" width="320" height="60" fill="var(--paper-sunken)" stroke="var(--mech-dark)" stroke-width="1.2"/>
      <text x="360" y="305" class="lbl-sm">intake runner</text>

      
      <g transform="translate(500,260) rotate(30)">
        <rect x="-28" y="-2" width="56" height="4" class="ink-fill"/>
        <circle cx="0" cy="0" r="3" class="ink-fill"/>
      </g>
      <text x="520" y="280" class="lbl-sm">plate</text>

      
      <circle cx="360" cy="170" r="18" class="box"/>
      <text x="360" y="168" text-anchor="middle" class="lbl-sm" style="font-weight:600">APPS</text>
      <text x="360" y="180" text-anchor="middle" class="lbl-xs">(cable)</text>
      
      <path d="M340 170 L352 170" class="ink-line"/>

      
      <rect x="430" y="150" width="60" height="40" rx="3" class="box"/>
      <text x="460" y="166" text-anchor="middle" class="lbl-sm" style="font-weight:600">Motor</text>
      <text x="460" y="178" text-anchor="middle" class="lbl-xs">+ mag. clutch</text>
      
      <path d="M460 190 L460 240 L500 258" class="mech-line"/>

      
      <circle cx="620" cy="170" r="18" class="box"/>
      <text x="620" y="168" text-anchor="middle" class="lbl-sm" style="font-weight:600">TPS</text>
      <text x="620" y="180" text-anchor="middle" class="lbl-xs">(plate)</text>
      
      <path d="M620 188 L620 230 L510 258" class="mech-line"/>

      
      <rect x="700" y="120" width="140" height="100" rx="2" class="box"/>
      <text x="770" y="110" text-anchor="middle" class="ttl">Engine ECU</text>
      <text x="770" y="150" text-anchor="middle" class="lbl-sm">non-linear</text>
      <text x="770" y="164" text-anchor="middle" class="lbl-sm">pedal → plate</text>
      <text x="770" y="178" text-anchor="middle" class="lbl-sm">map</text>
      <text x="770" y="200" text-anchor="middle" class="lbl-xs">+ idle · TRC · snow</text>

      
      <path d="M378 170 L700 150" class="signal-line" marker-end="url(#arrow-sig)"/>
      <text x="460" y="140" class="lbl-sm signal-fill">VPA / VPA2 (pedal position request)</text>

      <path d="M700 185 L492 170" class="signal-line" marker-end="url(#arrow-sig)"/>
      <text x="520" y="208" class="lbl-sm signal-fill">motor drive</text>

      <path d="M638 170 L700 170" class="measure-line" marker-end="url(#arrow-meas)"/>
      <text x="636" y="160" class="lbl-sm measure-fill">VTA / VTA2 feedback</text>

      
      <path d="M330 260 L340 260" class="ink-thin" marker-end="url(#arrow)"/>
      <path d="M660 260 L680 260" class="ink-thin" marker-end="url(#arrow)"/>
      <text x="300" y="256" class="lbl-xs">air in</text>
      <text x="685" y="256" class="lbl-xs">to engine</text>
    
</svg>
