<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" viewBox="-16.0 -16.0 572.0 392.0" width="572" height="392" role="img" aria-label="Pedal position to plate opening map, stock versus remapped">
<style>
svg { --paper:#f3ecde; --paper-raised:#faf4e5; --paper-sunken:#ead9bd; --ink:#1b1611; --ink-mid:#4a3e30; --ink-soft:#7a6b55; --rule:#b4a284; --rule-faint:#d7c7a7; --signal:#b43a1e; --signal-soft:#e9b7a8; --measure:#2b4867; --measure-soft:#a7bbd2; --mech:#c3a97d; --mech-dark:#6d5c48; --mech-fill:#d9c197; --green:#4a7a3a; color: var(--ink);
  --font-display: 'Fraunces','Iowan Old Style',Palatino,Georgia,serif;
  --font-body: 'Source Serif 4','Iowan Old Style',Georgia,serif;
  --font-mono: 'IBM Plex Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { svg { --paper:#16130f; --paper-raised:#1f1a14; --paper-sunken:#0e0c09; --ink:#ece3d1; --ink-mid:#c3b89f; --ink-soft:#9e937d; --rule:#4a3f30; --rule-faint:#2c2519; --signal:#e86a4d; --signal-soft:#4a211a; --measure:#8bb0d4; --measure-soft:#203247; --mech:#a08358; --mech-dark:#d9c197; --mech-fill:#3d3220; --green:#88b876; } }
.bg { fill: var(--paper-raised); stroke: var(--rule-faint); }
.d-svg { font-family: var(--font-mono); }
text { fill: var(--ink); font-size: 11px; font-family: var(--font-mono); }
.lbl-sm { font-size: 9px; }
.lbl-xs { font-size: 8px; fill: var(--ink-soft); }
.ttl { font-family: var(--font-display); font-size: 13px; font-weight: 500; }
.mech-fill { fill: var(--mech-fill); stroke: var(--mech-dark); stroke-width: 1.2; }
.mech-line { stroke: var(--mech-dark); stroke-width: 1.2; fill: none; }
.ink-line { stroke: var(--ink); stroke-width: 1.3; fill: none; }
.ink-thin { stroke: var(--ink-soft); stroke-width: 0.8; fill: none; }
.ink-fill { fill: var(--ink); }
.signal-line { stroke: var(--signal); stroke-width: 1.6; fill: none; }
.signal-fill { fill: var(--signal); }
.measure-line { stroke: var(--measure); stroke-width: 1.6; fill: none; }
.measure-fill { fill: var(--measure); }
.dashed { stroke-dasharray: 4 3; }
.dotted { stroke-dasharray: 1.5 2.5; }
.box { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 1.2; }
.box-signal { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.2; }
.box-measure { fill: var(--measure-soft); stroke: var(--measure); stroke-width: 1.2; }
.wire-red { stroke: var(--signal); stroke-width: 1.4; fill: none; }
.wire-blue { stroke: var(--measure); stroke-width: 1.4; fill: none; }
.wire-ink { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.wire-brown { stroke: var(--mech-dark); stroke-width: 1.4; fill: none; }
.wire-green { stroke: var(--green); stroke-width: 1.4; fill: none; }
.anno { font-size: 10px; fill: var(--ink-mid); font-style: italic; font-family: var(--font-body); }
</style>
<rect class="bg" x="-16.0" y="-16.0" width="572.0" height="392.0" rx="6"/>

      <title id="fig4-t">Pedal position to plate opening map, stock versus remapped</title>
      <g transform="translate(60,30)">
        <rect x="0" y="0" width="420" height="260" fill="var(--paper-sunken)"/>
        <g class="ink-thin dotted">
          <line x1="0" y1="52" x2="420" y2="52"/>
          <line x1="0" y1="104" x2="420" y2="104"/>
          <line x1="0" y1="156" x2="420" y2="156"/>
          <line x1="0" y1="208" x2="420" y2="208"/>
          <line x1="84" y1="0" x2="84" y2="260"/>
          <line x1="168" y1="0" x2="168" y2="260"/>
          <line x1="252" y1="0" x2="252" y2="260"/>
          <line x1="336" y1="0" x2="336" y2="260"/>
        </g>
        <line x1="0" y1="260" x2="420" y2="260" class="ink-line"/>
        <line x1="0" y1="0" x2="0" y2="260" class="ink-line"/>

        
        <text x="-8" y="263" text-anchor="end" class="lbl-sm">0%</text>
        <text x="-8" y="211" text-anchor="end" class="lbl-sm">20</text>
        <text x="-8" y="159" text-anchor="end" class="lbl-sm">40</text>
        <text x="-8" y="107" text-anchor="end" class="lbl-sm">60</text>
        <text x="-8" y="55" text-anchor="end" class="lbl-sm">80</text>
        <text x="-8" y="12" text-anchor="end" class="lbl-sm">100</text>
        <text x="0" y="280" class="lbl-sm">0%</text>
        <text x="84" y="280" class="lbl-sm">20</text>
        <text x="168" y="280" class="lbl-sm">40</text>
        <text x="252" y="280" class="lbl-sm">60</text>
        <text x="336" y="280" class="lbl-sm">80</text>
        <text x="420" y="280" text-anchor="end" class="lbl-sm">100%</text>
        <text x="210" y="302" text-anchor="middle" class="lbl-sm">Pedal position (driver request)</text>
        <text transform="translate(-40,130) rotate(-90)" text-anchor="middle" class="lbl-sm">Plate opening</text>

        
        <path d="M0 260 L420 0" class="ink-thin dashed"/>
        <text x="330" y="48" class="lbl-xs" fill="var(--ink-soft)">1:1 reference (cable)</text>

        
        <path d="M0 260 Q 120 240, 170 215 T 252 160 Q 320 100, 420 10" class="signal-line"/>
        <text x="150" y="245" class="lbl-xs signal-fill">stock ETCS-i map</text>

        
        <path d="M0 260 Q 50 180, 120 130 T 230 60 Q 320 20, 420 10" class="measure-line dashed"/>
        <text x="230" y="100" class="lbl-xs measure-fill">remapped (interceptor)</text>

        
        <g>
          <line x1="126" y1="260" x2="126" y2="125" class="ink-thin"/>
          <circle cx="126" cy="229" r="3" class="signal-fill"/>
          <line x1="126" y1="229" x2="0" y2="229" class="ink-thin"/>
          <circle cx="126" cy="125" r="3" class="measure-fill"/>
          <line x1="126" y1="125" x2="0" y2="125" class="ink-thin dashed"/>
          <text x="132" y="243" class="lbl-xs" fill="var(--signal)">stock ≈ 12%</text>
          <text x="130" y="118" class="lbl-xs" fill="var(--measure)">remap ≈ 52%</text>
        </g>
      </g>
    
</svg>
