<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" viewBox="-16.0 -16.0 632.0 392.0" width="632" height="392" role="img" aria-label="VPA and VPA2 voltages across pedal travel">
<style>
svg { --paper:#0d1117; --paper-raised:#161b22; --paper-sunken:#0d1117; --ink:#e6edf3; --ink-mid:#c9d1d9; --ink-soft:#8b949e; --rule:#30363d; --rule-faint:#21262d; --signal:#58a6ff; --signal-soft:#0f2541; --measure:#d2a8ff; --measure-soft:#271c3f; --mech:#6e7681; --mech-dark:#8b949e; --mech-fill:#21262d; --green:#3fb950; --red:#f85149; --red-soft:#3a1418; --wblue:#79c0ff; --brown:#d29922; color: var(--ink);
  --font-display: 'Fraunces','Iowan Old Style',Palatino,Georgia,serif;
  --font-body: 'Source Serif 4','Iowan Old Style',Georgia,serif;
  --font-mono: 'IBM Plex Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace; }
.bg { fill: var(--paper); stroke: var(--rule); }
.d-svg { font-family: var(--font-mono); }
text { fill: var(--ink); font-size: 11px; font-family: var(--font-mono); }
.lbl-sm { font-size: 9px; }
.lbl-xs { font-size: 8px; fill: var(--ink-soft); }
.ttl { font-family: var(--font-display); font-size: 13px; font-weight: 500; }
.mech-fill { fill: var(--mech-fill); stroke: var(--mech-dark); stroke-width: 1.2; }
.mech-line { stroke: var(--mech-dark); stroke-width: 1.2; fill: none; }
.ink-line { stroke: var(--ink); stroke-width: 1.3; fill: none; }
.ink-thin { stroke: var(--ink-soft); stroke-width: 0.8; fill: none; }
.ink-fill { fill: var(--ink); }
.signal-line { stroke: var(--signal); stroke-width: 1.6; fill: none; }
.signal-fill { fill: var(--signal); }
.measure-line { stroke: var(--measure); stroke-width: 1.6; fill: none; }
.measure-fill { fill: var(--measure); }
.dashed { stroke-dasharray: 4 3; }
.dotted { stroke-dasharray: 1.5 2.5; }
.box { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 1.2; }
.box-signal { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.2; }
.box-measure { fill: var(--measure-soft); stroke: var(--measure); stroke-width: 1.2; }
.wire-red { stroke: var(--red); stroke-width: 1.4; fill: none; }
.wire-blue { stroke: var(--wblue); stroke-width: 1.4; fill: none; }
.wire-ink { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.wire-brown { stroke: var(--brown); stroke-width: 1.4; fill: none; }
.wire-green { stroke: var(--green); stroke-width: 1.4; fill: none; }
.anno { font-size: 10px; fill: var(--ink-mid); font-style: italic; font-family: var(--font-body); }
</style>
<rect class="bg" x="-16.0" y="-16.0" width="632.0" height="392.0" rx="6"/>

      <title id="fig3-t">VPA and VPA2 voltages across pedal travel</title>

      
      <g transform="translate(60,30)">
        
        <rect x="0" y="0" width="480" height="260" fill="var(--paper-sunken)" stroke="none"/>

        
        <g class="ink-thin dotted">
          <line x1="0" y1="52" x2="480" y2="52"/>
          <line x1="0" y1="104" x2="480" y2="104"/>
          <line x1="0" y1="156" x2="480" y2="156"/>
          <line x1="0" y1="208" x2="480" y2="208"/>
          <line x1="96" y1="0" x2="96" y2="260"/>
          <line x1="192" y1="0" x2="192" y2="260"/>
          <line x1="288" y1="0" x2="288" y2="260"/>
          <line x1="384" y1="0" x2="384" y2="260"/>
        </g>

        
        <rect x="0" y="0" width="480" height="12" fill="var(--red-soft)"/>
        <text x="470" y="10" text-anchor="end" class="lbl-xs" style="fill:var(--red)">Fault zone VPA &gt; 4.8 V</text>

        
        <line x1="0" y1="260" x2="480" y2="260" class="ink-line"/>
        <line x1="0" y1="0" x2="0" y2="260" class="ink-line"/>

        
        <text x="-8" y="263" text-anchor="end" class="lbl-sm">0 V</text>
        <text x="-8" y="211" text-anchor="end" class="lbl-sm">1</text>
        <text x="-8" y="159" text-anchor="end" class="lbl-sm">2</text>
        <text x="-8" y="107" text-anchor="end" class="lbl-sm">3</text>
        <text x="-8" y="55" text-anchor="end" class="lbl-sm">4</text>
        <text x="-8" y="12" text-anchor="end" class="lbl-sm">5 V</text>

        
        <text x="0" y="280" class="lbl-sm">0%</text>
        <text x="96" y="280" class="lbl-sm">20</text>
        <text x="192" y="280" class="lbl-sm">40</text>
        <text x="288" y="280" class="lbl-sm">60</text>
        <text x="384" y="280" class="lbl-sm">80</text>
        <text x="480" y="280" class="lbl-sm" text-anchor="end">100%</text>
        <text x="240" y="300" text-anchor="middle" class="lbl-sm">Pedal position</text>

        
        <text transform="translate(-40,130) rotate(-90)" text-anchor="middle" class="lbl-sm">Voltage</text>

        
        
        <path d="M0 228.8 L480 52" class="signal-line"/>
        <text x="400" y="80" class="lbl-sm signal-fill">VPA</text>

        
        
        <path d="M0 145.6 C 100 125, 240 85, 480 10" class="measure-line"/>
        <text x="80" y="135" class="lbl-sm measure-fill">VPA2</text>

        
        <g>
          <line x1="192" y1="0" x2="192" y2="260" class="ink-thin dashed"/>
          <circle cx="192" cy="158" r="3" class="signal-fill"/>
          <circle cx="192" cy="95" r="3" class="measure-fill"/>
          <text x="200" y="175" class="lbl-xs" style="fill:var(--signal)">VPA ≈ 2.0 V</text>
          <text x="200" y="90" class="lbl-xs" style="fill:var(--measure)">VPA2 ≈ 3.4 V</text>
        </g>

      </g>
    
</svg>
