<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" viewBox="-16.0 -16.0 942.0 562.0" width="942" height="562" role="img" aria-label="DIY interceptor schematic — input stage, relay bypass, DAC output">
<style>
svg { --paper:#0d1117; --paper-raised:#161b22; --paper-sunken:#0d1117; --ink:#e6edf3; --ink-mid:#c9d1d9; --ink-soft:#8b949e; --rule:#30363d; --rule-faint:#21262d; --signal:#58a6ff; --signal-soft:#0f2541; --measure:#d2a8ff; --measure-soft:#271c3f; --mech:#6e7681; --mech-dark:#8b949e; --mech-fill:#21262d; --green:#3fb950; --red:#f85149; --red-soft:#3a1418; --wblue:#79c0ff; --brown:#d29922; color: var(--ink);
  --font-display: 'Fraunces','Iowan Old Style',Palatino,Georgia,serif;
  --font-body: 'Source Serif 4','Iowan Old Style',Georgia,serif;
  --font-mono: 'IBM Plex Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace; }
.bg { fill: var(--paper); stroke: var(--rule); }
.d-svg { font-family: var(--font-mono); }
text { fill: var(--ink); font-size: 11px; font-family: var(--font-mono); }
.lbl-sm { font-size: 9px; }
.lbl-xs { font-size: 8px; fill: var(--ink-soft); }
.ttl { font-family: var(--font-display); font-size: 13px; font-weight: 500; }
.mech-fill { fill: var(--mech-fill); stroke: var(--mech-dark); stroke-width: 1.2; }
.mech-line { stroke: var(--mech-dark); stroke-width: 1.2; fill: none; }
.ink-line { stroke: var(--ink); stroke-width: 1.3; fill: none; }
.ink-thin { stroke: var(--ink-soft); stroke-width: 0.8; fill: none; }
.ink-fill { fill: var(--ink); }
.signal-line { stroke: var(--signal); stroke-width: 1.6; fill: none; }
.signal-fill { fill: var(--signal); }
.measure-line { stroke: var(--measure); stroke-width: 1.6; fill: none; }
.measure-fill { fill: var(--measure); }
.dashed { stroke-dasharray: 4 3; }
.dotted { stroke-dasharray: 1.5 2.5; }
.box { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 1.2; }
.box-signal { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.2; }
.box-measure { fill: var(--measure-soft); stroke: var(--measure); stroke-width: 1.2; }
.wire-red { stroke: var(--red); stroke-width: 1.4; fill: none; }
.wire-blue { stroke: var(--wblue); stroke-width: 1.4; fill: none; }
.wire-ink { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.wire-brown { stroke: var(--brown); stroke-width: 1.4; fill: none; }
.wire-green { stroke: var(--green); stroke-width: 1.4; fill: none; }
.anno { font-size: 10px; fill: var(--ink-mid); font-style: italic; font-family: var(--font-body); }
</style>
<rect class="bg" x="-16.0" y="-16.0" width="942.0" height="562.0" rx="6"/>

      <title id="fig7-t">DIY interceptor schematic — input stage, relay bypass, DAC output</title>

      
      <text x="20" y="36" class="ttl">Sensor-side pigtail</text>
      <text x="340" y="36" class="ttl">Interceptor box</text>
      <text x="895" y="36" class="ttl" text-anchor="end">ECU-side pigtail</text>

      
      <g transform="translate(60,60)">
        
        <circle cx="0" cy="20" r="4" class="ink-fill"/>
        <text x="-10" y="23" text-anchor="end" class="lbl-sm">E2</text>
        <path d="M4 20 L820 20" class="wire-brown"/>
        
        <circle cx="0" cy="60" r="4" class="ink-fill"/>
        <text x="-10" y="63" text-anchor="end" class="lbl-sm">VC</text>
        <path d="M4 60 L820 60" class="wire-red"/>
        <text x="200" y="54" text-anchor="middle" class="lbl-xs">pass-through, not broken</text>
        
        <circle cx="0" cy="140" r="4" class="ink-fill"/>
        <text x="-10" y="143" text-anchor="end" class="lbl-sm">VPA (S)</text>
        <path d="M4 140 L170 140" class="wire-green"/>
        
        <circle cx="0" cy="190" r="4" class="ink-fill"/>
        <text x="-10" y="193" text-anchor="end" class="lbl-sm">VPA2 (S)</text>
        <path d="M4 190 L170 190" class="wire-blue"/>
      </g>

      
      <path d="M450 80 L450 140" class="ink-thin"/>
      <path d="M470 120 L470 140" class="ink-thin"/>
      <text x="478" y="100" class="lbl-xs">E2 → analog reference</text>
      <text x="478" y="132" class="lbl-xs">VC → measured</text>

      
      <g transform="translate(230,180)">
        <rect x="0" y="0" width="140" height="90" class="box"/>
        <text x="70" y="22" text-anchor="middle" class="lbl-sm" style="font-weight:600">Input stage</text>
        <text x="70" y="40" text-anchor="middle" class="lbl-xs">10 kΩ series R</text>
        <text x="70" y="54" text-anchor="middle" class="lbl-xs">RC filter ≈ 1 kHz</text>
        <text x="70" y="68" text-anchor="middle" class="lbl-xs">clamps + divider</text>
      </g>

      
      <g transform="translate(430,140)">
        <rect x="0" y="0" width="160" height="130" class="box"/>
        <text x="80" y="20" text-anchor="middle" class="ttl">MCU</text>
        <text x="80" y="40" text-anchor="middle" class="lbl-xs">STM32 / RP2040</text>
        <text x="80" y="58" text-anchor="middle" class="lbl-xs">ADC: VPA, VPA2, VC</text>
        <text x="80" y="74" text-anchor="middle" class="lbl-xs">DAC × 2 over SPI</text>
        <text x="80" y="90" text-anchor="middle" class="lbl-xs">curve + VPA2 regen</text>
        <text x="80" y="106" text-anchor="middle" class="lbl-xs">watchdog kick</text>
        <text x="80" y="122" text-anchor="middle" class="lbl-xs">1 kHz loop</text>
      </g>
      <path d="M370 200 L430 200" class="wire-green"/>
      <path d="M370 250 L430 250" class="wire-blue"/>

      
      <g transform="translate(620,110)">
        <rect x="0" y="0" width="130" height="60" class="box"/>
        <text x="65" y="20" text-anchor="middle" class="lbl-sm" style="font-weight:600">DAC + buffer</text>
        <text x="65" y="34" text-anchor="middle" class="lbl-xs">MCP4822 → OPA2171</text>
        <text x="65" y="47" text-anchor="middle" class="lbl-xs">gain 1.25 · 330 Ω out</text>
      </g>
      <path d="M590 165 L620 140" class="ink-thin"/>

      
      <g transform="translate(620,260)">
        <rect x="0" y="0" width="130" height="90" class="box"/>
        <text x="65" y="16" text-anchor="middle" class="lbl-sm" style="font-weight:600">Bypass relay (DPDT)</text>
        <text x="65" y="78" text-anchor="middle" class="lbl-xs">coil: watchdog AND mode</text>
      </g>
      
      <path d="M660 170 L660 260" class="wire-green"/>
      <path d="M710 170 L710 260" class="wire-blue"/>
      <text x="664" y="215" class="lbl-xs">NO</text>
      <text x="714" y="235" class="lbl-xs">NO</text>
      
      <path d="M200 200 L200 300 L620 300" class="wire-green dashed"/>
      <path d="M215 250 L215 330 L620 330" class="wire-blue dashed"/>
      <text x="240" y="295" class="lbl-xs">NC ← raw VPA (relay off = stock)</text>
      <text x="240" y="345" class="lbl-xs">NC ← raw VPA2</text>
      
      <path d="M750 300 L880 300" class="wire-green"/>
      <path d="M750 330 L880 330" class="wire-blue"/>
      <text x="756" y="294" class="lbl-xs">COM</text>
      <text x="756" y="324" class="lbl-xs">COM</text>

      <g>
        <circle cx="880" cy="80" r="4" class="ink-fill"/><text x="880" y="72" text-anchor="middle" class="lbl-xs">E2</text>
        <circle cx="880" cy="120" r="4" class="ink-fill"/><text x="880" y="112" text-anchor="middle" class="lbl-xs">VC</text>
        <circle cx="880" cy="300" r="4" class="ink-fill"/><text x="880" y="292" text-anchor="middle" class="lbl-xs">VPA</text>
        <circle cx="880" cy="330" r="4" class="ink-fill"/><text x="880" y="348" text-anchor="middle" class="lbl-xs">VPA2</text>
      </g>

      
      <g transform="translate(230,420)">
        <rect x="0" y="0" width="520" height="90" class="box"/>
        <text x="260" y="20" text-anchor="middle" class="lbl-sm" style="font-weight:600">Power supply</text>
        <text x="20" y="42" class="lbl-xs">switched 12 V →</text>
        <text x="110" y="42" class="lbl-xs">1 A fuse → reverse diode → TVS → automotive buck → 5 V / 3.3 V</text>
        <text x="20" y="70" class="lbl-xs">also 8 V rail for op-amp (so it can reach 5.1 V output)</text>
        <text x="260" y="82" text-anchor="middle" class="lbl-xs" style="fill:var(--red)">GROUND to chassis near ECU, NEVER through E2</text>
      </g>

    
</svg>
