<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" viewBox="-16.0 -16.0 932.0 472.0" width="932" height="472" role="img" aria-label="Siecle complete system topology">
<style>
svg { --paper:#f3ecde; --paper-raised:#faf4e5; --paper-sunken:#ead9bd; --ink:#1b1611; --ink-mid:#4a3e30; --ink-soft:#7a6b55; --rule:#b4a284; --rule-faint:#d7c7a7; --signal:#b43a1e; --signal-soft:#e9b7a8; --measure:#2b4867; --measure-soft:#a7bbd2; --mech:#c3a97d; --mech-dark:#6d5c48; --mech-fill:#d9c197; --green:#4a7a3a; color: var(--ink);
  --font-display: 'Fraunces','Iowan Old Style',Palatino,Georgia,serif;
  --font-body: 'Source Serif 4','Iowan Old Style',Georgia,serif;
  --font-mono: 'IBM Plex Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { svg { --paper:#16130f; --paper-raised:#1f1a14; --paper-sunken:#0e0c09; --ink:#ece3d1; --ink-mid:#c3b89f; --ink-soft:#9e937d; --rule:#4a3f30; --rule-faint:#2c2519; --signal:#e86a4d; --signal-soft:#4a211a; --measure:#8bb0d4; --measure-soft:#203247; --mech:#a08358; --mech-dark:#d9c197; --mech-fill:#3d3220; --green:#88b876; } }
.bg { fill: var(--paper-raised); stroke: var(--rule-faint); }
.d-svg { font-family: var(--font-mono); }
text { fill: var(--ink); font-size: 11px; font-family: var(--font-mono); }
.lbl-sm { font-size: 9px; }
.lbl-xs { font-size: 8px; fill: var(--ink-soft); }
.ttl { font-family: var(--font-display); font-size: 13px; font-weight: 500; }
.mech-fill { fill: var(--mech-fill); stroke: var(--mech-dark); stroke-width: 1.2; }
.mech-line { stroke: var(--mech-dark); stroke-width: 1.2; fill: none; }
.ink-line { stroke: var(--ink); stroke-width: 1.3; fill: none; }
.ink-thin { stroke: var(--ink-soft); stroke-width: 0.8; fill: none; }
.ink-fill { fill: var(--ink); }
.signal-line { stroke: var(--signal); stroke-width: 1.6; fill: none; }
.signal-fill { fill: var(--signal); }
.measure-line { stroke: var(--measure); stroke-width: 1.6; fill: none; }
.measure-fill { fill: var(--measure); }
.dashed { stroke-dasharray: 4 3; }
.dotted { stroke-dasharray: 1.5 2.5; }
.box { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 1.2; }
.box-signal { fill: var(--signal-soft); stroke: var(--signal); stroke-width: 1.2; }
.box-measure { fill: var(--measure-soft); stroke: var(--measure); stroke-width: 1.2; }
.wire-red { stroke: var(--signal); stroke-width: 1.4; fill: none; }
.wire-blue { stroke: var(--measure); stroke-width: 1.4; fill: none; }
.wire-ink { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.wire-brown { stroke: var(--mech-dark); stroke-width: 1.4; fill: none; }
.wire-green { stroke: var(--green); stroke-width: 1.4; fill: none; }
.anno { font-size: 10px; fill: var(--ink-mid); font-style: italic; font-family: var(--font-body); }
</style>
<rect class="bg" x="-16.0" y="-16.0" width="932.0" height="472.0" rx="6"/>

      <title id="fig5-t">Siecle complete system topology</title>

      
      <rect x="20" y="30" width="440" height="380" fill="var(--paper-sunken)" stroke="var(--rule)" stroke-dasharray="3 3" stroke-width="1"/>
      <text x="40" y="52" class="ttl">Engine bay</text>

      
      <rect x="40" y="80" width="110" height="110" rx="4" class="mech-fill"/>
      <text x="95" y="100" text-anchor="middle" class="lbl-sm">Throttle body</text>
      <circle cx="80" cy="140" r="12" class="box"/>
      <text x="80" y="143" text-anchor="middle" class="lbl-xs" style="font-weight:600">APPS</text>
      <circle cx="120" cy="140" r="12" class="box"/>
      <text x="120" y="143" text-anchor="middle" class="lbl-xs" style="font-weight:600">TPS</text>

      
      <path d="M80 152 L80 240 L220 240" class="wire-ink"/>
      <path d="M120 152 L120 240 L220 240" class="wire-ink"/>
      <text x="130" y="235" class="lbl-xs">4 wires each</text>

      
      <rect x="220" y="200" width="200" height="180" rx="3" class="box"/>
      <text x="320" y="225" text-anchor="middle" class="ttl">Engine ECU</text>
      
      <g>
        <rect x="235" y="245" width="30" height="24" class="ink-fill"/><text x="250" y="282" text-anchor="middle" class="lbl-xs">E6</text>
        <rect x="275" y="245" width="30" height="24" class="box-signal"/><text x="290" y="282" text-anchor="middle" class="lbl-xs" fill="var(--signal)">E5</text>
        <rect x="315" y="245" width="30" height="24" class="ink-fill"/><text x="330" y="282" text-anchor="middle" class="lbl-xs">E4</text>
        <rect x="355" y="245" width="30" height="24" class="ink-fill"/><text x="370" y="282" text-anchor="middle" class="lbl-xs">E3</text>
        <rect x="395" y="245" width="20" height="24" class="ink-fill"/><text x="405" y="282" text-anchor="middle" class="lbl-xs">E2</text>
      </g>

      
      <rect x="275" y="300" width="90" height="60" class="box-signal"/>
      <text x="320" y="320" text-anchor="middle" class="lbl-sm" style="font-weight:600" fill="var(--signal)">DCX-T3</text>
      <text x="320" y="334" text-anchor="middle" class="lbl-xs" fill="var(--signal)">adapter + trimmer</text>
      <text x="320" y="348" text-anchor="middle" class="lbl-xs" fill="var(--signal)">(engine bay)</text>
      <path d="M290 269 L295 300 M305 269 L310 300 M320 269 L325 300 M335 269 L340 300" class="signal-line" stroke-width="0.8"/>

      
      <path d="M365 320 L430 320 L430 265 L410 265" class="wire-red"/>
      <text x="440" y="300" class="lbl-xs" fill="var(--signal)">red wire</text>
      <text x="440" y="312" class="lbl-xs" fill="var(--signal)">→ E2-16 (IG 12V)*</text>

      
      <line x1="460" y1="20" x2="460" y2="420" class="ink-line" stroke-width="3"/>
      <text x="454" y="42" text-anchor="end" class="lbl-xs" fill="var(--ink-soft)">firewall</text>

      
      <rect x="470" y="30" width="410" height="380" fill="var(--paper-sunken)" stroke="var(--rule)" stroke-dasharray="3 3"/>
      <text x="490" y="52" class="ttl">Cabin</text>

      
      <path d="M365 335 Q 420 335, 440 310 Q 460 285, 500 285" class="wire-blue"/>
      <text x="378" y="372" class="lbl-xs">signal leads</text>
      <text x="378" y="384" class="lbl-xs">(2-pin + 4-pin)</text>

      
      <rect x="500" y="240" width="150" height="100" rx="3" class="box"/>
      <text x="575" y="260" text-anchor="middle" class="ttl">FA-OTB</text>
      <text x="575" y="278" text-anchor="middle" class="lbl-sm">signal remap</text>
      <text x="575" y="292" text-anchor="middle" class="lbl-sm">mode logic</text>
      <text x="575" y="320" text-anchor="middle" class="lbl-xs">under carpet /</text>
      <text x="575" y="333" text-anchor="middle" class="lbl-xs">dash panel</text>

      
      <rect x="700" y="80" width="80" height="50" rx="4" class="box"/>
      <text x="740" y="100" text-anchor="middle" class="lbl-sm" style="font-weight:600">PWR+</text>
      <text x="740" y="118" text-anchor="middle" class="lbl-xs">switch (dash)</text>
      <path d="M650 260 L700 260 Q 720 260, 720 240 L720 130" class="wire-ink"/>
      <text x="663" y="252" class="lbl-xs">3-pin</text>

      
      <rect x="700" y="330" width="110" height="50" rx="2" class="box"/>
      <text x="755" y="350" text-anchor="middle" class="lbl-sm" style="font-weight:600">OBD-II (DLC3)</text>
      <text x="755" y="368" text-anchor="middle" class="lbl-xs">under steering wheel</text>

      
      <rect x="660" y="300" width="40" height="20" class="box-signal"/>
      <text x="680" y="314" text-anchor="middle" class="lbl-xs" fill="var(--signal)">FAOBD</text>
      <path d="M650 310 L660 310" class="wire-red"/>
      <path d="M700 320 L710 345" class="wire-red"/>
      <text x="628" y="295" class="lbl-xs" fill="var(--signal)">constant 12 V</text>

    
</svg>
